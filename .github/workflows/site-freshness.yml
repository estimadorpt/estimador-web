name: Site freshness

# Is estimador.pt still updating? A static export stands still without anyone
# noticing: in October 2026 a data sync turned `npm run check` red and every
# deploy failed for eight days. This runs scripts/check-freshness.mjs every
# morning and after every deploy from `main`, and keeps one issue open, assigned
# to the owner, for as long as the answer is no.

on:
  schedule:
    # 07:17 UTC, every day. Off the hour, where scheduled runs queue.
    - cron: '17 7 * * *'
  workflow_run:
    workflows: ['Azure Static Web Apps CI/CD']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: site-freshness
  cancel-in-progress: false

env:
  ALERT_TITLE: estimador.pt has stopped updating
  ALERT_ASSIGNEE: bernardocaldas

jobs:
  check:
    name: Is the site still updating?
    # After a deploy, only pushes to main matter: a pull request's preview build
    # says nothing about the live site.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No `npm ci`: the script uses Node alone, so the check still runs when a
      # broken lock file is the reason the deploys are failing.
      - name: Ask the three questions
        id: check
        continue-on-error: true
        run: node scripts/check-freshness.mjs --report freshness-report.md
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Find the open alert
        id: alert
        if: steps.check.outputs.stale != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"$ALERT_TITLE\")) | .[0].number // empty")
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Open the alert, or add today's report to it
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.alert.outputs.number }}
        run: |
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file freshness-report.md
          else
            # An alert nobody is assigned to is still better than no alert.
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ALERT_TITLE" \
              --body-file freshness-report.md --assignee "$ALERT_ASSIGNEE" ||
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$ALERT_TITLE" \
                --body-file freshness-report.md
          fi

      - name: Close the alert once the site is updating again
        if: steps.check.outputs.stale == 'false' && steps.alert.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.alert.outputs.number }}
        run: gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "$(cat freshness-report.md)"

      # Red when the site has stopped (1) and when GitHub could not be asked (2),
      # so the run list shows at a glance which mornings were not healthy.
      - name: Fail the run unless the site is updating
        if: steps.check.outcome == 'failure'
        run: exit 1
